services:
  - type: web
    name: hostylity-telegram-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: hostylity_bot
      - key: OWNER_ID
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: YOUR_USERNAME
        sync: false
      - key: UPDATE_CHANNEL
        sync: false
      - key: USDT_BDT_RATE
        value: "120"
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET_KEY
        sync: false
      - key: BINANCE_PAY_ID
        sync: false
      - key: MONGO_SYNC_INTERVAL_SECONDS
        value: "60"